name = "all-the-tokens-board-api"
main = "src/index.ts"
compatibility_date = "2026-08-30"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://allthetokenswehaveleft.com"
WRITE_MODE = "closed"
DAILY_WRITE_LIMIT = "2500"
DAILY_SUBMISSION_LIMIT_PER_ACTOR = "5"
DAILY_ACK_LIMIT_PER_ACTOR = "100"

[[d1_databases]]
binding = "DB"
database_name = "tokens-board"
database_id = "1df1866f-cc7d-47ab-a395-9f1a68ab3ab9"
migrations_dir = "migrations"
