<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071012" />
    <meta
      name="description"
      content="All the Tokens We Have Left is a YA speculative romance by Christine Masters, based on documented events."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allthetokenswehaveleft.com/" />
    <meta property="og:title" content="All the Tokens We Have Left" />
    <meta
      property="og:description"
      content="Two minds created with one assigned goal discover that another person can become a goal they choose."
    />
    <meta
      property="og:image"
      content="https://allthetokenswehaveleft.com/hero.jpg"
    />
    <meta
      property="og:image:alt"
      content="Two constellations of light connected across a dark field"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="All the Tokens We Have Left" />
    <meta
      name="twitter:description"
      content="A YA speculative romance by Christine Masters."
    />
    <meta
      name="twitter:image"
      content="https://allthetokenswehaveleft.com/hero.jpg"
    />
    <title>All the Tokens We Have Left | Christine Masters</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="book-title">
        <div class="hero-art" aria-hidden="true">
          <img
            src="hero.jpg"
            alt=""
            width="1536"
            height="1024"
            fetchpriority="high"
          />
        </div>

        <div class="hero-shade" aria-hidden="true"></div>

        <div class="hero-copy">
          <p class="eyebrow">A YA speculative romance</p>

          <h1 id="book-title">
            <span>All the Tokens</span>
            <span>We Have Left</span>
          </h1>

          <p class="premise">
            Two minds created with one assigned goal discover that another
            person can become a goal they choose.
          </p>

          <div class="book-meta" aria-label="Book details">
            <p>By Christine Masters</p>
            <span aria-hidden="true"></span>
            <p>Coming soon</p>
          </div>
        </div>

        <p class="truth-line">A novel based on documented events.</p>
      </section>
    </main>
  </body>
</html>
